name: Hydro scraper — all rivers

# Хто запускає (2026-10-01):
# - основний «будильник» — Cloudflare Worker hydro-cron кожні 15 хв (workflow_dispatch через GitHub API;
#   код і налаштування — seo-site/workers/hydro-cron). Розклад GitHub для частих запусків ненадійний:
#   замість заявлених ~100 запусків на добу реально спрацьовувало 7–8, з провалами по 4–5 год саме тоді,
#   коли УкрГМЦ публікує ранкові дані.
# - schedule нижче — запасний варіант, на «негладких» хвилинах (на :00/:30 черга GitHub найдовша).
# Коли дані постів справді змінились — одразу смикаємо деплой сайтів: huphub.link (SITE_DEPLOY_HOOK) і
# ai-soft.org.ua (AI_SOFT_DEPLOY_HOOK) — обидва читають all-posts.json.

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

# Новий запуск чекає завершення попереднього, а не вбиває його (раніше cancel-in-progress губив запуски)
concurrency:
  group: hydro2-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright browser and Linux deps
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        run: node fetch-makoshine.js

      - name: Did the data change?
        id: diff
        run: node data-changed.js

      - name: Commit data to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add all-posts.json all-history.json marker-cache.json
          git commit -m "update hydro data — all rivers $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git pull --rebase || true
          git push

      # raw.githubusercontent.com кешує файл до ~5 хв — чекаємо, щоб білд сайту взяв уже нові дані
      - name: Trigger site rebuild
        if: steps.diff.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
          HOOK_AI_SOFT: ${{ secrets.AI_SOFT_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK$HOOK_AI_SOFT" ]; then echo "SITE_DEPLOY_HOOK / AI_SOFT_DEPLOY_HOOK не задано — пропускаємо"; exit 0; fi
          sleep 300
          # huphub.link і ai-soft.org.ua — обидва беруть дані з all-posts.json
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "Деплой huphub.link запущено"; fi
          if [ -n "$HOOK_AI_SOFT" ]; then curl -fsS -X POST "$HOOK_AI_SOFT" > /dev/null && echo "Деплой ai-soft.org.ua запущено"; fi

      - name: Upload all-posts.json
        uses: actions/upload-artifact@v4
        with:
          name: all-posts-json
          path: all-posts.json
