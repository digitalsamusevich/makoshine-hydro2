name: Hydro scraper — all rivers

# Як це працює (2026-10-08, замість частого cron):
# - Один запуск = «зміна» ~5,5 год: watch.js сам перевіряє джерело кожні 10 хв (уранці 08:30–10:30 за Києвом — 3 хв), поки сьогоднішніх даних немає,
#   і раз на годину — коли вже є; комітить зміни й смикає деплой сайтів (SITE_DEPLOY_HOOK, AI_SOFT_DEPLOY_HOOK).
# - Наприкінці зміна запускає наступну (workflow_dispatch через вбудований GITHUB_TOKEN — нових секретів не треба).
#   Тож ланцюжок безперервний і не залежить від розкладу GitHub, який для частих запусків ненадійний:
#   замість заявлених запусків кожні 30 хв реально було ~5 на добу, з провалами до 7 год (08.10: 02:01 → 09:06 UTC).
# - schedule нижче — лише запасний перезапуск, якщо ланцюжок обірвався (впав раннер тощо). Поки зміна працює,
#   запасні запуски чекають у черзі (concurrency) і скасовуються наступною зміною — це нормально.
# Репозиторій публічний, тож хвилини Actions безкоштовні.

on:
  workflow_dispatch:
  # Зміна самого «чергового» запускає його одразу (коміти даних від GITHUB_TOKEN нових запусків не створюють)
  push:
    branches: [main]
    paths: ['.github/workflows/hydro2.yml', 'watch.js', 'fetch-makoshine.js']
  schedule:
    - cron: '41 */2 * * *'

concurrency:
  group: hydro2-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright browser and Linux deps
        run: npx playwright install --with-deps chromium

      - name: Watch the source and commit new data
        id: watch
        env:
          LOOP_MINUTES: '320'
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
          AI_SOFT_DEPLOY_HOOK: ${{ secrets.AI_SOFT_DEPLOY_HOOK }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          node watch.js

      # Наступна зміна — лише якщо цикл справді відпрацював (watch.js пише chain=true); при ранньому збої
      # ланцюжок не крутиться «кільцем», а чекає запасного cron.
      - name: Start the next shift
        if: always() && steps.watch.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hydro2.yml --ref "${{ github.ref_name }}"
